name: dashboard_renderer
description: Standalone dashboard renderer for testing and screenshots
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  dashboard_model:
    path: ../../packages/dashboard_model
  dashboard_runtime:
    path: ../../packages/dashboard_runtime
  widgets_library:
    path: ../../packages/widgets_library
  vesc_telemetry:
    path: ../../packages/vesc_telemetry
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
