name: dashboard
description: Veschub Dashboard — the runtime app that renders dashboards live (phone, Pi, desktop).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dashboard_model:
    path: ../../packages/dashboard_model
  dashboard_runtime:
    path: ../../packages/dashboard_runtime
  dashboard_storage:
    path: ../../packages/dashboard_storage
  settings:
    path: ../../packages/settings
  widgets_library:
    path: ../../packages/widgets_library
  templates:
    path: ../../packages/templates
  vesc_proto:
    path: ../../packages/vesc_proto
  vesc_transport:
    path: ../../packages/vesc_transport
  vesc_telemetry:
    path: ../../packages/vesc_telemetry
  vesc_sim:
    path: ../../tools/vesc_sim
  path_provider: ^2.1.3
  file_picker: ^8.0.0
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
