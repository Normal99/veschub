name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Check formatting
        run: melos run format

      - name: Analyze
        run: melos run analyze

      - name: Generate code (build_runner)
        run: melos run build_runner

      - name: Test
        run: melos run test

      - name: Build dashboard (Linux)
        run: flutter build linux --release
        working-directory: apps/dashboard

      - name: Build studio (Linux)
        run: flutter build linux --release
        working-directory: apps/studio

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-linux
          path: apps/dashboard/build/linux/x64/release/bundle/

      - name: Upload studio artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-linux
          path: apps/studio/build/linux/x64/release/bundle/
