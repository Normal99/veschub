name: widgets_library
description: Built-in dashboard widgets (gauge, bar, text, chart, map, status, web…) shared by studio and runtime.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  dashboard_model:
    path: ../dashboard_model
  dashboard_runtime:
    path: ../dashboard_runtime
  paint_dsl:
    path: ../paint_dsl
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Rajdhani (SIL OFL 1.1 — see lib/assets/fonts/OFL.txt): a technical,
  # geometric typeface with proper tabular figures, used as the dashboard's
  # default font instead of the platform system font. Declared here (not
  # per-app) so apps/studio, apps/dashboard, and tools/dashboard_renderer
  # all get it automatically just by depending on this package — see
  # https://docs.flutter.dev/cookbook/design/fonts#from-a-package for the
  # required `packages/widgets_library/Rajdhani` fontFamily prefix.
  fonts:
    - family: Rajdhani
      fonts:
        - asset: lib/assets/fonts/Rajdhani-Light.ttf
          weight: 300
        - asset: lib/assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    # Orbitron (SIL OFL 1.1 — lib/assets/fonts/OFL-Orbitron.txt): a
    # geometric sci-fi display face, offered as a per-widget alternative
    # for a more futuristic HUD look.
    - family: Orbitron
      fonts:
        - asset: lib/assets/fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Orbitron-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/Orbitron-ExtraBold.ttf
          weight: 800
    # Share Tech Mono (SIL OFL 1.1 — lib/assets/fonts/OFL-ShareTechMono.txt):
    # a monospaced terminal/telemetry look, single weight.
    - family: ShareTechMono
      fonts:
        - asset: lib/assets/fonts/ShareTechMono-Regular.ttf
          weight: 400
    # The following 8 (SIL OFL 1.1 — see each OFL-<Family>.txt) exist to
    # give the car-brand templates a distinct font per brand instead of all
    # nine sharing Rajdhani — none of these are the real proprietary
    # typeface a manufacturer actually ships (Tesla's Gotham, BMW Type,
    # Audi Type, Porsche Next, Apple SF Pro are not freely licensable), they
    # were picked as a free stand-in with a comparable feel. Also offered
    # as general per-widget choices in the font picker, same as the three
    # above.
    #
    # Titillium Web and Barlow Condensed ship real static weight files
    # (bundled below); Inter/Outfit/Roboto/Manrope/Exo2/Sora only ship as a
    # single variable-font file in Google's font repo — bundled as one
    # asset at weight 400 like ShareTechMono, so picking a different
    # fontWeight for these six won't select a truly distinct weight (Skia
    # falls back to synthetic bold for heavier requests); the font's own
    # shape/personality — the actual point of this pass — is unaffected.
    - family: TitilliumWeb
      fonts:
        - asset: lib/assets/fonts/TitilliumWeb-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/TitilliumWeb-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/TitilliumWeb-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: lib/assets/fonts/BarlowCondensed-Light.ttf
          weight: 300
        - asset: lib/assets/fonts/BarlowCondensed-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: lib/assets/fonts/Inter-Variable.ttf
          weight: 400
    - family: Outfit
      fonts:
        - asset: lib/assets/fonts/Outfit-Variable.ttf
          weight: 400
    - family: Roboto
      fonts:
        - asset: lib/assets/fonts/Roboto-Variable.ttf
          weight: 400
    - family: Manrope
      fonts:
        - asset: lib/assets/fonts/Manrope-Variable.ttf
          weight: 400
    - family: Exo2
      fonts:
        - asset: lib/assets/fonts/Exo2-Variable.ttf
          weight: 400
    - family: Sora
      fonts:
        - asset: lib/assets/fonts/Sora-Variable.ttf
          weight: 400
